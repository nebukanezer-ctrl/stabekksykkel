<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testprøve 3 · Verdien av algebraiske uttrykk</title>
</head>
<body>
<div id="app"></div>
<script src="../assets/quiz.js"></script>
<script>

const rader = [["4","2","6","2","4"],["3","8","?","?","?"],["0","−2","?","?","?"],["−6","−10","?","?","?"]];
const tabell = `<figure><table class="tab"><thead><tr><th><i>x</i></th><th><i>y</i></th><th><i>x</i> + <i>y</i></th><th><i>x</i> − <i>y</i></th><th>5<i>x</i> − 8<i>y</i></th></tr></thead><tbody>${rader.map(r => "<tr>" + r.map(c => `<td${c === "?" ? ' class="q"' : ""}>${c}</td>`).join("") + "</tr>").join("")}</tbody></table></figure>`;
const rekt = `<figure><svg viewBox="0 0 300 130" role="img" aria-label="Rektangel med lengde 5 cm og bredde 2 cm"><rect x="20" y="20" width="180" height="80" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="3"/><text x="110" y="120" text-anchor="middle" font-size="15" fill="currentColor"><tspan font-style="italic">l</tspan> = 5 cm</text><text x="210" y="65" font-size="15" fill="currentColor"><tspan font-style="italic">b</tspan> = 2 cm</text></svg></figure>`;
const css = document.createElement("style");
css.textContent = `.tab{border-collapse:collapse;margin:0 auto;font-variant-numeric:tabular-nums}.tab th,.tab td{border:1px solid var(--line);padding:7px 14px;text-align:center}.tab th{background:var(--accent-soft);font-family:var(--display)}.tab td.q{color:var(--muted)}`;
document.head.appendChild(css);

quiz({
  id: "alg-3",
  title: "Testprøve 3 · Verdien av algebraiske uttrykk",
  sub: "Matematikk 8. trinn · kapittel 3A · flervalg · ingen hjelpemidler",
  back: "../",
  goalsTitle: "Resultat per tema",
  figs: { tabell: tabell, rekt: rekt },
  goals: {
    sett: "Sette inn tall for variabler",
    rek: "Regnerekkefølge",
    brok: "Brøk i algebraiske uttrykk",
    tab: "Tabeller med uttrykk",
    form: "Formler",
    var: "Variabler og skrivemåte",
    sam: "Uttrykk på tallinja"
  },
  questions: [
 {t:"Verdien av uttrykk",
  g:"sett",
  q:`Hva er verdien av <i>n</i> − 6 hvis <i>n</i> = −4?`,
  o:[`−10`,`2`,`10`,`−2`],
  a:0,
  e:`Vi setter inn −4 for <i>n</i>: −4 − 6 = −10. Å trekke fra 6 betyr å gå 6 til venstre på tallinja.`},
 {t:"Verdien av uttrykk",
  g:"sett",
  q:`Hva er verdien av 2<i>a</i> + 3<i>b</i> hvis <i>a</i> = 2 og <i>b</i> = −1?`,
  o:[`1`,`7`,`−1`,`5`],
  a:0,
  e:`2 · 2 + 3 · (−1) = 4 + (−3) = 4 − 3 = 1. Pass på at 3 · (−1) = −3, ikke 3.`},
 {t:"Verdien av uttrykk",
  g:"sett",
  q:`Hva er verdien av 4<i>s</i> − 6<i>t</i> hvis <i>s</i> = 5 og <i>t</i> = 0?`,
  o:[`20`,`14`,`26`,`30`],
  a:0,
  e:`4 · 5 − 6 · 0 = 20 − 0 = 20. Når t = 0 blir 6t lik 0, ikke 6.`},
 {t:"Negative tall",
  g:"sett",
  q:`Hva er verdien av 4<i>s</i> − 6<i>t</i> hvis <i>s</i> = <i>t</i> = −3?`,
  o:[`6`,`−30`,`−6`,`30`],
  a:0,
  e:`4 · (−3) − 6 · (−3) = −12 − (−18) = −12 + 18 = 6. Å trekke fra et negativt tall er det samme som å legge til.`},
 {t:"Regnerekkefølge",
  g:"rek",
  q:`Hva er verdien av 5<i>k</i> − 3<i>m</i><i>n</i> + 2 hvis <i>k</i> = 2, <i>m</i> = 4 og <i>n</i> = 3?`,
  o:[`−24`,`−4`,`86`,`−28`],
  a:0,
  e:`Gange før pluss og minus: 5 · 2 − 3 · 4 · 3 + 2 = 10 − 36 + 2 = −24.`},
 {t:"Negative tall",
  g:"sett",
  q:`Hva er verdien av 5<i>k</i> − 3<i>m</i><i>n</i> + 2 hvis <i>k</i> = <i>m</i> = <i>n</i> = −4?`,
  o:[`−66`,`30`,`−70`,`−68`],
  a:0,
  e:`5 · (−4) − 3 · (−4) · (−4) + 2. Først er (−4) · (−4) = 16, så 3 · 16 = 48. Da blir det −20 − 48 + 2 = −66.`},
 {t:"Brøk i uttrykk",
  g:"brok",
  q:`Hva er verdien av 5<i>k</i> − 3<i>m</i><i>n</i> + 2 hvis <i>k</i> = ${F(2,5)}, <i>m</i> = ${F(1,2)} og <i>n</i> = ${F(3,4)}?`,
  o:[`${F(23,8)}`,`${F(41,8)}`,`${F(7,8)}`,`${F(9,8)}`],
  a:0,
  e:`5 · ${F(2,5)} = 2. 3 · ${F(1,2)} · ${F(3,4)} = ${F(9,8)}. Til sammen 2 − ${F(9,8)} + 2 = 4 − ${F(9,8)} = ${F(23,8)}.`},
 {t:"Brøk i uttrykk",
  g:"brok",
  q:`Hva er verdien av ${F("3<i>a</i>",2)} − ${F("<i>b</i>",4)} + ${F("2<i>a</i>","<i>b</i>")} hvis <i>a</i> = 8 og <i>b</i> = 4?`,
  o:[`15`,`7`,`17`,`19`],
  a:0,
  e:`3 · 8 : 2 = 12, 4 : 4 = 1 og 2 · 8 : 4 = 4. Da er 12 − 1 + 4 = 15.`},
 {t:"Tabell",
  g:"tab",
  fig:"tabell",
  q:`Tabellen viser verdier av <i>x</i> og <i>y</i>. Hva skal stå i ruta for <i>x</i> − <i>y</i> når <i>x</i> = 3 og <i>y</i> = 8?`,
  o:[`−5`,`5`,`11`,`−11`],
  a:0,
  e:`<i>x</i> − <i>y</i> = 3 − 8 = −5. Nå går vi 8 ned fra 3, og kommer under null.`},
 {t:"Tabell",
  g:"tab",
  fig:"tabell",
  q:`Hva er verdien av 5<i>x</i> − 8<i>y</i> når <i>x</i> = −6 og <i>y</i> = −10?`,
  o:[`50`,`−110`,`110`,`−50`],
  a:0,
  e:`5 · (−6) − 8 · (−10) = −30 − (−80) = −30 + 80 = 50.`},
 {t:"Regnerekkefølge",
  g:"rek",
  q:`Hva er verdien av −<i>x</i> · <i>x</i> + 3<i>x</i> − 7 hvis <i>x</i> = 6?`,
  o:[`−25`,`47`,`−11`,`−61`],
  a:0,
  e:`−6 · 6 = −36. 3 · 6 = 18. Da er −36 + 18 − 7 = −25.`},
 {t:"Negative tall",
  g:"sett",
  q:`Hva er verdien av −<i>x</i> · <i>x</i> + 3<i>x</i> − 7 hvis <i>x</i> = −4?`,
  o:[`−35`,`−3`,`−11`,`−19`],
  a:0,
  e:`−(−4) · (−4) = 4 · (−4) = −16. 3 · (−4) = −12. Da er −16 − 12 − 7 = −35.`},
 {t:"Algebraisk skrivemåte",
  g:"var",
  q:`Hva er verdien av 4<i>a</i> hvis <i>a</i> = 3?`,
  o:[`12`,`43`,`7`,`81`],
  a:0,
  e:`Mellom tallet og variabelen skjules et gangetegn: 4<i>a</i> betyr 4 · <i>a</i> = 4 · 3 = 12. Det betyr ikke 43.`},
 {t:"Negative tall",
  g:"sett",
  q:`Hva er verdien av 2<i>a</i> + 3<i>b</i> hvis <i>a</i> = −3 og <i>b</i> = −6?`,
  o:[`−24`,`24`,`−12`,`12`],
  a:0,
  e:`2 · (−3) + 3 · (−6) = −6 + (−18) = −24.`},
 {t:"Formel",
  g:"form",
  fig:"rekt",
  q:`Arealet av et rektangel er gitt ved formelen <i>A</i> = <i>l</i> · <i>b</i>. Hva er arealet når <i>l</i> = 5 cm og <i>b</i> = 2 cm?`,
  o:[`10 cm²`,`14 cm²`,`7 cm²`,`10 cm`],
  a:0,
  e:`<i>A</i> = 5 cm · 2 cm = 10 cm². Areal måles i kvadratcentimeter. (14 cm er omkretsen, og 7 er bare 5 + 2.)`},
 {t:"Algebraisk skrivemåte",
  g:"var",
  q:`Hvilket av uttrykkene har <u>alltid</u> samme verdi som <i>x</i> · <i>y</i>?`,
  o:[`<i>y</i> · <i>x</i>`,`<i>x</i> + <i>y</i>`,`<i>x</i> − <i>y</i>`,`Tallet der <i>x</i> er første siffer og <i>y</i> er andre siffer`],
  a:0,
  e:`Rekkefølgen har ingen betydning når vi ganger: <i>x</i> · <i>y</i> = <i>y</i> · <i>x</i>. Ved pluss og minus får vi andre svar, og et tosifret tall som 23 er 10 · 2 + 3, ikke 2 · 3.`},
 {t:"Uttrykk på tallinja",
  g:"sam",
  q:`På en tallinje plasserer vi et rødt punkt ved 2<i>x</i> og et blått punkt ved <i>x</i> − 1. For hvilke verdier av <i>x</i> ligger det røde punktet til venstre for det blå?`,
  o:[`<i>x</i> &lt; −1`,`<i>x</i> &gt; −1`,`<i>x</i> &lt; 1`,`<i>x</i> &gt; 1`],
  a:0,
  e:`Prøv noen verdier. <i>x</i> = −2: rødt −4, blått −3, og −4 ligger til venstre for −3. <i>x</i> = 0: rødt 0, blått −1, og da ligger rødt til høyre. Grensen er <i>x</i> = −1, der de to punktene faller sammen (−2 og −2).`},
 {t:"Variabler",
  g:"var",
  q:`Hva er en variabel i matematikk?`,
  o:[`Et symbol, ofte en bokstav, som står for et tall og som kan variere`,`Et tall som aldri endrer seg`,`Et regnetegn som +, −, · eller :`,`Svaret på et regnestykke`],
  a:0,
  e:`Variabler skrives ofte som små bokstaver som <i>a</i>, <i>b</i>, <i>n</i>, <i>t</i> eller <i>x</i>. Et algebraisk uttrykk er et regneuttrykk med en eller flere variabler.`}
  ]
});
</script>
</body>
</html>
